name: Refresh security lockfile (temporary)
on:
  pull_request:
    paths:
      - '.github/workflows/refresh-security-lock.yml'
      - 'package.json'
permissions:
  contents: read
jobs:
  resolve:
    if: github.repository == 'orelkrylatiy/calendar-ops' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'fix/dependency-security'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dependency-security
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve explicit upgrades
        env:
          HUSKY: '0'
          CYPRESS_INSTALL_BINARY: '0'
        run: |
          npm install --package-lock-only --ignore-scripts --no-fund
          npm audit fix --package-lock-only --ignore-scripts --no-fund --json > /tmp/fix.json || true
          npm audit --json > /tmp/audit.json || true
          node -e "const a=require('/tmp/audit.json');if(!a.metadata)process.exit(1);console.log(JSON.stringify(a.metadata.vulnerabilities));for(const [k,v] of Object.entries(a.vulnerabilities||{}))console.log(k,v.severity,JSON.stringify(v.fixAvailable),JSON.stringify(v.nodes))"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          if git diff --cached --quiet; then exit 0; fi
          git commit --no-verify -m 'chore: resolve security dependency upgrades'
          git push origin HEAD:fix/dependency-security
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-resolution
          path: /tmp/audit.json
