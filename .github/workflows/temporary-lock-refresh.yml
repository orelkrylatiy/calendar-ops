name: Refresh compatible lockfile (one-off)
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/temporary-lock-refresh.yml'
permissions:
  contents: read
jobs:
  refresh:
    if: github.repository == 'orelkrylatiy/calendar-ops' && github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'feat/calendar-ops-workspace-v2'
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/calendar-ops-workspace-v2
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply compatible dependency fixes
        env:
          HUSKY: '0'
          CYPRESS_INSTALL_BINARY: '0'
        run: |
          npm audit fix --package-lock-only --ignore-scripts --no-fund --json > /tmp/compatible-fix.json || true
          npm audit --json > /tmp/audit.json || true
          node -e "const a=require('/tmp/audit.json');if(!a.metadata)process.exit(1);console.log(JSON.stringify(a.metadata.vulnerabilities))"
          git diff --stat -- package-lock.json
          if git diff --quiet -- package-lock.json; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit --no-verify -m 'chore: apply compatible npm audit lockfile fixes'
          git push origin HEAD:feat/calendar-ops-workspace-v2
